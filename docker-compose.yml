# WRAITH — docker compose
#
# Core service (`wraith`) is fully offline at runtime: API + SPA on :8000, cases
# data on a named volume. It needs no other service to run.
#
# The BloodHound CE reference stack (Neo4j + PostgreSQL + BloodHound) is OPTIONAL
# and gated behind the `bloodhound` profile — it starts ONLY when you ask for it:
#     docker compose --profile bloodhound up
# BloodHound is the swappable reference adapter; the canonical WRAITH graph is the
# product. You ingest a WRAITH BHCE export (`wraith export bloodhound`) into this
# stack for the rich reference UI. Pulling those images needs network the first
# time (pre-pull/`docker save` them for a true air-gap); the `wraith` service does
# not.

services:
  # ---------------------------------------------------------------------------
  # Core WRAITH app — API (/api/v1) + built React SPA (/) on one origin.
  # ---------------------------------------------------------------------------
  wraith:
    build:
      context: .
      dockerfile: Dockerfile
    image: wraith:latest
    container_name: wraith
    ports:
      - "8000:8000"
    volumes:
      - wraith-cases:/data/cases
    environment:
      WRAITH_CASES_ROOT: /data/cases
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/v1', timeout=4).status==200 else sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # OPTIONAL reference stack — `--profile bloodhound` only.
  # Service names (graph-db / app-db) match BloodHound CE's expected connections.
  # ---------------------------------------------------------------------------
  graph-db:
    image: neo4j:4.4.42-community
    container_name: wraith-bh-neo4j
    profiles: ["bloodhound"]
    environment:
      NEO4J_AUTH: neo4j/bloodhoundcommunityedition
      NEO4J_dbms_allow__upgrade: "true"
    volumes:
      - bh-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app-db:
    image: postgres:16.6-alpine
    container_name: wraith-bh-postgres
    profiles: ["bloodhound"]
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhoundcommunityedition
      POSTGRES_DB: bloodhound
    volumes:
      - bh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound -d bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  bloodhound:
    # NOTE: pin this to the exact BloodHound CE release you vendored. Tags are
    # published at docker.io/specterops/bloodhound. Adjust if your pulled release
    # differs — kept explicit (not :latest) for deterministic, repeatable runs.
    image: specterops/bloodhound:v6.3.0
    container_name: wraith-bloodhound
    profiles: ["bloodhound"]
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      bhe_disable_cypher_complexity_limit: "false"
      bhe_enable_cypher_mutations: "false"
      bhe_graph_query_memory_limit: "2"
      bhe_database_connection: "user=bloodhound password=bloodhoundcommunityedition dbname=bloodhound host=app-db"
      bhe_neo4j_connection: "neo4j://neo4j:bloodhoundcommunityedition@graph-db:7687/"
    restart: unless-stopped

volumes:
  wraith-cases:
  bh-neo4j-data:
  bh-postgres-data:
